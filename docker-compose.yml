services:
  minio:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    container_name: recomart-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  postgres:
    image: postgres:15
    container_name: recomart-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: recomart
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: recomart_dw
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: recomart-redis
    ports:
      - "6379:6379"

volumes:
  minio_data:
  postgres_data: